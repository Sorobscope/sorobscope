[package]
name = "sorobscope"
version = "0.1.0"
edition = "2024"
description = "Human-readable Soroban RPC inspection: decoded contract events, storage entries, and transaction summaries. Read-only."
license = "Apache-2.0"
repository = "https://github.com/Sorobscope/sorobscope"
homepage = "https://github.com/Sorobscope/sorobscope"
readme = "README.md"
keywords = ["stellar", "soroban", "blockchain", "cli", "xdr"]
categories = ["command-line-utilities", "development-tools"]
# The fixture contracts are separate crates used only for testing against a live
# network. They are not part of the binary and have no business in a published tarball.
exclude = ["fixtures/", "docs/", "CLAUDE.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
soroban-client = "0.5.9"
tokio = { version = "1.53.1", features = ["full"] }
